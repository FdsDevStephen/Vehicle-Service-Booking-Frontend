<div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-6">
        <div class="card shadow">
          <div class="card-header bg-primary text-white text-center">
            <h3>Add Service</h3>
          </div>
          <div class="card-body">
            <form [formGroup]="form" (ngSubmit)="onSubmit()">
              <div class="form-group mb-3">
                <label for="description" class="form-label">Service Description</label>
                <input
                  type="text"
                  id="description"
                  formControlName="description"
                  class="form-control"
                  placeholder="Enter service description"
                />
                <div *ngIf="form.get('description')?.invalid && form.get('description')?.touched" class="text-danger mt-1">
                  Service description is required.
                </div>
              </div>
  
              <div class="form-group mb-3">
                <label for="price" class="form-label">Price</label>
                <input
                  type="number"
                  id="price"
                  formControlName="price"
                  class="form-control"
                  placeholder="Enter service price"
                />
                <div *ngIf="form.get('price')?.invalid && form.get('price')?.touched" class="text-danger mt-1">
                  Price is required and must be a positive number.
                </div>
              </div>
  
              <div class="d-grid">
                <button type="submit" class="btn btn-success" [disabled]="form.invalid">Add Service</button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
