<div class="profile-container">
  <form #profileForm="ngForm" (ngSubmit)="onUpdate(profileForm)" class="profile-form">
    <h2 class="profile-title">User Profile</h2>

    <div class="avatar-circle">
      <span class="avatar-letter">{{ profile.name?.charAt(0).toUpperCase() }}</span>
    </div>

    <div class="form-group">
      <label for="name">Name</label>
      <input type="text" id="name" name="name" required minlength="2" [(ngModel)]="profile.name" #nameRef="ngModel">
      <div *ngIf="nameRef.invalid && nameRef.touched" class="error">Name is required (min 2 chars)</div>
    </div>

    <div class="form-group">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" [value]="profile.email" disabled />
    </div>

    <div class="form-group">
      <label for="phone">Phone</label>
      <input type="text" id="phone" name="phone" required [(ngModel)]="profile.phone" #phoneRef="ngModel">
      <div *ngIf="phoneRef.invalid && phoneRef.touched" class="error">Phone is required</div>
    </div>

    <div class="form-group">
      <label for="address">Address</label>
      <input type="text" id="address" name="address" [(ngModel)]="profile.address">
    </div>

    <div *ngIf="isServiceCenter">
      <h3>Service Center Info</h3>
      <div class="form-group">
        <label for="serviceCenterName">Center Name</label>
        <input type="text" id="serviceCenterName" name="serviceCenterName" [(ngModel)]="profile.serviceCenterName">
      </div>
      <div class="form-group">
        <label for="serviceCenterLocation">Location</label>
        <input type="text" id="serviceCenterLocation" name="serviceCenterLocation" [(ngModel)]="profile.serviceCenterLocation">
      </div>
      <div class="form-group">
        <label for="serviceCenterContact">Contact</label>
        <input type="text" id="serviceCenterContact" name="serviceCenterContact" [(ngModel)]="profile.serviceCenterContact">
      </div>
    </div>

    <button type="submit" [disabled]="!profileForm.valid || isSubmitting" class="submit-btn">
      {{ isSubmitting ? 'Saving...' : 'Update Profile' }}
    </button>
  </form>
</div>
