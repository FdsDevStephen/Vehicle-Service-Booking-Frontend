<app-header></app-header>
<div class="login-wrapper">
  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="login-card">
    <h2 class="login-title">Login</h2>

    <div class="form-group">
      <label for="email">Email</label>
      <input type="email" id="email" formControlName="email" placeholder="Enter your email" />
      <div *ngIf="form.get('email')?.invalid && form.get('email')?.touched" class="error-msg">
        Valid email is required.
      </div>
    </div>

    <div class="form-group">
      <label for="password">Password</label>
      <input type="password" id="password" formControlName="password" placeholder="Enter your password" />
      <div *ngIf="form.get('password')?.invalid && form.get('password')?.touched" class="error-msg">
        Password is required.
      </div>
    </div>

    <button type="submit" class="btn-submit">Login</button>

    <p class="bottom-text">
      Don’t have an account?
      <a routerLink="/register">Register</a>
    </p>
  </form>
</div>
<app-footer></app-footer>
